<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>AI Productivity Assistant</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 52px 20px;
      background:
        radial-gradient(ellipse at 12% 0%, #e5eefe 0, transparent 38%),
        #f5f7fb;
    }

    main { width: min(760px, 100%); margin: 0 auto; }
    .eyebrow { color: #5266d4; font-size: .8rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.045em; }
    .intro { margin: 0 0 28px; color: #606b80; line-height: 1.6; }
    .panel { padding: clamp(20px, 4vw, 32px); border: 1px solid #e3e8f1; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px #25365b0d; }
    label { display: block; margin-bottom: 8px; font-size: .92rem; font-weight: 650; }
    select, textarea, input[type="file"] {
      width: 100%;
      border: 1px solid #d9dfeb;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    select { min-height: 46px; padding: 0 12px; }
    textarea { min-height: 180px; padding: 13px; resize: vertical; line-height: 1.5; }
    input[type="file"] { padding: 10px; }
    select:focus, textarea:focus, input:focus-visible, button:focus-visible {
      outline: 3px solid #aab5ff;
      outline-offset: 2px;
    }
    .field { margin-bottom: 20px; }
    .hint { margin: 7px 0 0; color: #6c778c; font-size: .83rem; }
    .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    button {
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #4e5fd0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #3c4dbd; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { color: #59657a; font-size: .9rem; }
    #result[hidden], [hidden] { display: none; }
    #result { margin-top: 22px; }
    #result h2 { margin: 0 0 10px; font-size: 1.05rem; }
    #result pre {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      margin: 0;
      padding: 18px;
      border: 1px solid #e3e8f1;
      border-radius: 12px;
      background: #f8f9fc;
      font: .92rem/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .meta { margin: 0 0 10px; color: #68748a; font-size: .8rem; }
    .error { color: #a52a38; }
    @media (max-width: 520px) {
      body { padding: 32px 14px; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AI tools for everyday work</p>
    <h1>AI Productivity Assistant</h1>
    <p class="intro">Summarize, translate, extract information, analyze sentiment, or generate Python code from text or a UTF-8 text file.</p>

    <form id="assistant-form" class="panel">
      <div class="field">
        <label for="task">Choose a task</label>
        <select id="task" name="task">
          <option value="summarize">Summarize text</option>
          <option value="analyze-sentiment">Analyze sentiment</option>
          <option value="translate">Translate text</option>
          <option value="extract-information">Extract information</option>
          <option value="generate-code">Generate Python code</option>
        </select>
      </div>

      <div id="language-field" class="field" hidden>
        <label for="language">Translate to</label>
        <input id="language" name="language" type="text" placeholder="e.g. Spanish">
      </div>

      <div class="field">
        <label for="text">Text or prompt</label>
        <textarea id="text" name="text" placeholder="Enter the text you want to work with..."></textarea>
      </div>

      <div class="field">
        <label for="file">Or upload a text file</label>
        <input id="file" name="file" type="file" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv">
        <p class="hint">Supported: .txt, .md, .csv · UTF-8 · up to 1 MB</p>
      </div>

      <div class="actions">
        <button id="submit-button" type="submit">Run assistant</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>

      <section id="result" aria-live="polite" hidden>
        <h2>Result</h2>
        <p id="result-meta" class="meta"></p>
        <pre id="result-text"></pre>
      </section>
    </form>
  </main>

  <script>
    const form = document.querySelector("#assistant-form");
    const taskSelect = document.querySelector("#task");
    const languageField = document.querySelector("#language-field");
    const languageInput = document.querySelector("#language");
    const fileInput = document.querySelector("#file");
    const textInput = document.querySelector("#text");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    const resultPanel = document.querySelector("#result");
    const resultMeta = document.querySelector("#result-meta");
    const resultText = document.querySelector("#result-text");

    taskSelect.addEventListener("change", () => {
      const translating = taskSelect.value === "translate";
      languageField.hidden = !translating;
      languageInput.required = translating;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const task = taskSelect.value;
      const file = fileInput.files[0];
      const text = textInput.value.trim();

      if (!file && !text) {
        status.textContent = "Enter text or choose a file.";
        status.className = "error";
        return;
      }
      if (task === "translate" && !languageInput.value.trim()) {
        status.textContent = "Enter the target language.";
        status.className = "error";
        languageInput.focus();
        return;
      }

      button.disabled = true;
      status.className = "";
      status.textContent = "Working...";
      resultPanel.hidden = true;

      try {
        let response;
        if (file) {
          const data = new FormData();
          data.append("file", file);
          data.append("language", languageInput.value);
          response = await fetch(`/upload/${task}`, { method: "POST", body: data });
        } else {
          const payload = task === "generate-code"
            ? { description: text }
            : task === "translate"
              ? { text, language: languageInput.value.trim() }
              : { text };
          response = await fetch(`/${task}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
        }

        const data = await response.json();
        if (!response.ok || !data.success) {
          const message = typeof data.error === "string"
            ? data.error
            : data.detail || "The request could not be completed.";
          throw new Error(message);
        }

        resultMeta.textContent = [
          data.task,
          `${data.provider} · ${data.model}`,
          data.filename,
        ].filter(Boolean).join("  /  ");
        resultText.textContent = data.result;
        resultPanel.hidden = false;
        status.textContent = "Complete.";
      } catch (error) {
        status.textContent = error.message || "The request could not be completed.";
        status.className = "error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
